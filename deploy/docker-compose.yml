services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: harnessagent-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-harness_agent}
      POSTGRES_USER: ${DB_USER:-harness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-harness}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-harness} -d ${DB_NAME:-harness_agent}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
